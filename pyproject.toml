[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ck42x-pl-arch"
version = "0.1.7"
description = "CK42X Payload Lab Architect — forge Flipper BadUSB bundles and host agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CK42X" }]
dependencies = [
  "httpx>=0.27.0",
  "fs==2.4.16",
  "pyfatfs>=1.0.5",
  "pyserial>=3.5",
  "setuptools>=69.0.0,<81",
  "rich>=13.7.0",
  "textual>=0.79.0",
]

[project.scripts]
ck42x = "ck42x_pl_arch.__main__:main"
ck42x-pl-arch = "ck42x_pl_arch.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ck42x_pl_arch"]

[tool.hatch.build.targets.sdist]
include = ["src/ck42x_pl_arch", "install", "README.md"]
